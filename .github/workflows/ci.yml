# ============================================================
# Deep Search Pro CI
# 1. test  : ruff 静态检查 + pytest 单元/接口测试（Python 3.10 / 3.11 矩阵）
# 2. docker: 验证 Dockerfile 可正常构建（补齐本地无 Docker 的验证缺口）
# ============================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # 系统级依赖：WeasyPrint 需要 Pango（测试不直接跑 PDF 转换，
      # 但保证 pdf_converter 的延迟导入路径在 CI 环境同样成立）
      - name: Install system libs for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Ruff lint（只查硬错误：语法错误 / 未定义名称）
        run: ruff check --select E9,F --no-cache .

      - name: Run pytest
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t deep-search-pro:ci .

      - name: Sanity check image entrypoint
        run: docker run --rm deep-search-pro:ci python -c "import fastapi, weasyprint; print('image ok')"
