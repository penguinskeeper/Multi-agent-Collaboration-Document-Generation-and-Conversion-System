<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Search Pro - 多智能体协作演示</title>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-sub: #64748b;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --success: #16a34a;
    --error: #dc2626;
    --warn: #d97706;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; }
  header .status { font-size: 12px; color: var(--text-sub); margin-left: auto; }
  header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-sub); margin-right: 4px; vertical-align: middle; }
  header .dot.on { background: var(--success); }
  header .dot.off { background: var(--error); }

  main { flex: 1; display: flex; gap: 16px; padding: 16px 24px; overflow: hidden; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  .panel-title { padding: 10px 16px; font-size: 13px; font-weight: 600;
    color: var(--text-sub); border-bottom: 1px solid var(--border); }

  /* 左侧：对话区 */
  .chat-panel { flex: 1.2; min-width: 380px; }
  #chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex;
    flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 10px;
    font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--primary); color: #fff;
    border-bottom-right-radius: 2px; }
  .msg.bot { align-self: flex-start; background: var(--bg);
    border-bottom-left-radius: 2px; }
  .msg.bot.error { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; }

  .chat-input { display: flex; gap: 8px; padding: 12px 16px;
    border-top: 1px solid var(--border); }
  .chat-input textarea {
    flex: 1; resize: none; height: 64px; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 14px;
    font-family: inherit; outline: none;
  }
  .chat-input textarea:focus { border-color: var(--primary); }
  .chat-input button {
    align-self: flex-end; background: var(--primary); color: #fff; border: none;
    border-radius: 8px; padding: 10px 22px; font-size: 14px; cursor: pointer;
  }
  .chat-input button:hover { background: var(--primary-dark); }
  .chat-input button:disabled { background: #94a3b8; cursor: not-allowed; }

  /* 右侧：进度时间线 + 文件列表 */
  .side-panel { flex: 0.8; min-width: 320px; display: flex; flex-direction: column; gap: 16px; }
  #timeline { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .tl-item { display: flex; gap: 10px; padding: 6px 0; font-size: 13px;
    line-height: 1.5; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .tl-item .icon { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .tl-item.tool .icon { background: #dbeafe; }
  .tl-item.agent .icon { background: #ede9fe; }
  .tl-item.done .icon { background: #dcfce7; }
  .tl-item.err .icon { background: #fee2e2; }
  .tl-item.info .icon { background: #f1f5f9; }
  .tl-item .time { color: var(--text-sub); font-size: 11px; margin-top: 2px; }

  #files { max-height: 40%; overflow-y: auto; padding: 10px 16px; }
  .file-item { display: flex; align-items: center; gap: 8px; padding: 7px 4px;
    font-size: 13px; border-bottom: 1px dashed var(--border); }
  .file-item:last-child { border-bottom: none; }
  .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-item .size { color: var(--text-sub); font-size: 11px; }
  .file-item a { color: var(--primary); text-decoration: none; font-size: 12px; }
  .file-item a:hover { text-decoration: underline; }
  .empty-tip { color: var(--text-sub); font-size: 12px; text-align: center; padding: 20px 0; }

  /* 最终结果 Markdown 简易渲染样式 */
  .md-body h1, .md-body h2, .md-body h3 { margin: 10px 0 6px; }
  .md-body ul, .md-body ol { padding-left: 22px; margin: 6px 0; }
  .md-body table { border-collapse: collapse; margin: 8px 0; }
  .md-body th, .md-body td { border: 1px solid var(--border); padding: 6px 10px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>🤖 Deep Search Pro</h1>
  <span style="font-size:12px;color:var(--text-sub)">主智能体 × 3 子智能体（网络搜索 / 数据库 / 知识库）</span>
  <span class="status"><span id="ws-dot" class="dot"></span><span id="ws-text">未连接</span></span>
</header>

<main>
  <!-- 左：对话 -->
  <section class="panel chat-panel">
    <div class="panel-title">对话</div>
    <div id="chat-log"></div>
    <div class="chat-input">
      <textarea id="query-input" placeholder="输入任务，例如：搜索最近 AI Agent 领域的进展并生成一份报告，转成 PDF"
        onkeydown="if(event.ctrlKey&&event.key==='Enter')sendTask()"></textarea>
      <button id="send-btn" onclick="sendTask()">发送</button>
    </div>
  </section>

  <!-- 右：进度 + 文件 -->
  <aside class="side-panel">
    <section class="panel" style="flex:1">
      <div class="panel-title">执行进度（实时推送）</div>
      <div id="timeline"><div class="empty-tip">暂无进度，先发一个任务吧</div></div>
    </section>
    <section class="panel">
      <div class="panel-title">生成的文件</div>
      <div id="files"><div class="empty-tip">任务完成后在这里查看产出</div></div>
    </section>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
let threadId = null;
let ws = null;
let sessionDir = null;

/* ---------- WebSocket ---------- */
function getApiKey() { return localStorage.getItem('deep_search_api_key') || ''; }
function connectWS() {
  if (!threadId) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const key = getApiKey();
  const keyQs = key ? `?key=${encodeURIComponent(key)}` : '';
  ws = new WebSocket(`${proto}://${location.host}/ws/${threadId}${keyQs}`);
  ws.onopen = () => setWSState(true);
  ws.onclose = () => { setWSState(false); setTimeout(connectWS, 2000); }; // 断线重连
  ws.onerror = () => setWSState(false);
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'pong') return;
    if (data.type === 'monitor_event') handleMonitorEvent(data);
  };
}
function setWSState(on) {
  $('ws-dot').className = 'dot ' + (on ? 'on' : 'off');
  $('ws-text').textContent = on ? '实时通道已连接' : '未连接';
}

/* ---------- 监控事件 ---------- */
function handleMonitorEvent(evt) {
  const { event, message, data } = evt;
  if (event === 'session_created') {
    sessionDir = data?.path || null;
  }
  if (event === 'task_result') {
    addMsg('bot', extractResultText(data?.result || message));
    loadFiles();
  }
  const kind = event === 'tool_start' ? 'tool'
             : event === 'assistant_call' ? 'agent'
             : event === 'task_result' ? 'done'
             : event === 'error' ? 'err' : 'info';
  addTimeline(kind, message);
}

function extractResultText(result) {
  // result 可能是结构化消息列表，尽力抽出文本
  if (typeof result === 'string') return result;
  try {
    const msgs = result?.messages || result;
    if (Array.isArray(msgs)) {
      const last = [...msgs].reverse().find(m => m.content);
      return last ? last.content : JSON.stringify(result, null, 2);
    }
  } catch (_) {}
  return JSON.stringify(result, null, 2);
}

/* ---------- 发送任务 ---------- */
async function sendTask() {
  const input = $('query-input');
  const query = input.value.trim();
  if (!query) return;
  input.value = '';
  addMsg('user', query);
  $('send-btn').disabled = true;
  $('timeline').innerHTML = '';
  clearFiles();

  try {
    // 若服务端开启了 API_KEY 校验，自动携带本地保存的密钥（localStorage 记忆）
    const headers = { 'Content-Type': 'application/json' };
    const apiKey = getApiKey();
    if (apiKey) headers['X-API-Key'] = apiKey;

    const resp = await fetch('/api/task', {
      method: 'POST',
      headers,
      body: JSON.stringify({ query, thread_id: threadId })
    });
    if (resp.status === 401) {
      const key = prompt('服务端已开启 API Key 校验，请输入密钥：');
      if (key) {
        localStorage.setItem('deep_search_api_key', key.trim());
        addMsg('bot', '密钥已保存，请重新发送任务。', true);
      }
      return;
    }
    const res = await resp.json();
    if (res.thread_id && res.thread_id !== threadId) {
      // 新会话：切换实时通道
      if (ws) ws.onclose = null;
      threadId = res.thread_id;
      connectWS();
    }
  } catch (err) {
    addMsg('bot', `请求失败：${err.message}`, true);
  } finally {
    $('send-btn').disabled = false;
  }
}

/* ---------- 文件列表 ---------- */
async function loadFiles() {
  if (!sessionDir) return;
  try {
    const key = getApiKey();
    const keyQs = key ? `&key=${encodeURIComponent(key)}` : '';
    const resp = await fetch(`/api/files?path=${encodeURIComponent(sessionDir)}${keyQs}`);
    const res = await resp.json();
    if (res.error) return;
    const box = $('files');
    box.innerHTML = '';
    if (!res.files || !res.files.length) {
      box.innerHTML = '<div class="empty-tip">本次任务没有生成文件</div>';
      return;
    }
    const keyQsDl = getApiKey() ? `&key=${encodeURIComponent(getApiKey())}` : '';
    for (const f of res.files) {
      const div = document.createElement('div');
      div.className = 'file-item';
      div.innerHTML = `
        <span>📄</span>
        <span class="name" title="${f.path}">${f.name}</span>
        <span class="size">${formatSize(f.size)}</span>
        <a href="/api/download?path=${encodeURIComponent(f.path)}${keyQsDl}">下载</a>`;
      box.appendChild(div);
    }
  } catch (_) {}
}
function clearFiles() { $('files').innerHTML = '<div class="empty-tip">任务完成后在这里查看产出</div>'; }
function formatSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

/* ---------- 渲染辅助 ---------- */
function addMsg(role, text, isError = false) {
  const div = document.createElement('div');
  div.className = 'msg ' + role + (isError ? ' error' : '');
  div.textContent = text;
  $('chat-log').appendChild(div);
  $('chat-log').scrollTop = $('chat-log').scrollHeight;
}

const ICONS = { tool: '🔧', agent: '🤝', done: '✅', err: '❌', info: 'ℹ️' };
function addTimeline(kind, message) {
  const tl = $('timeline');
  const tip = tl.querySelector('.empty-tip');
  if (tip) tip.remove();
  const div = document.createElement('div');
  div.className = 'tl-item ' + kind;
  const now = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  div.innerHTML = `<span class="icon">${ICONS[kind] || 'ℹ️'}</span>
    <span><div>${escapeHtml(message)}</div><div class="time">${now}</div></span>`;
  tl.appendChild(div);
  tl.scrollTop = tl.scrollHeight;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 假设服务端在开发模式下直接访问根路径 */
window.addEventListener('load', () => { setWSState(false); });
</script>
</body>
</html>
